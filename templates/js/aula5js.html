<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="/css/aula6js.css">
</head>
<body>
    <h1>Exemplo de hoje: interação JS x HTML</h1>
    <button id="botaoluz" onclick="apagar()">Apagar</button>

    <script>
        function apagar(){
            
            document.body.style.backgroundColor = "black";
            document.body.style.color = "white";
        }

    </script>
</body>
</html>
